<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Link Vault</title>
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #10171F;
    --ink-soft: #57626C;
    --ink-faint: #8A939B;
    --accent: #2F6F5E;
    --accent-ink: #FFFFFF;
    --border: #D2D7DC;
    --surface-2: #EEF0F2;
    --danger: #A8402E;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
  }
  .pad { padding: 14px; }
  h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  label { display: block; font-size: 11px; color: var(--ink-soft); margin: 8px 0 3px; }
  input[type="text"], input[type="url"] {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink);
    background: var(--bg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    width: 100%;
    margin-top: 10px;
    padding: 9px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { font-size: 12px; margin-top: 8px; min-height: 16px; }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--accent); }
  .recent { border-top: 1px solid var(--border); padding: 10px 14px 14px; }
  .recent h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin: 0 0 6px; }
  .recent-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px 0;
    border-bottom: 1px solid var(--surface-2);
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-item .platform { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .recent-item a { font-size: 11px; color: var(--ink-soft); text-decoration: none; word-break: break-all; }
  .recent-item a:hover { color: var(--accent); text-decoration: underline; }
  .dashboard-link { display: block; text-align: center; padding: 10px 14px; font-size: 12px; color: var(--accent); text-decoration: none; border-top: 1px solid var(--border); }
  .dashboard-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="pad">
    <h1><span class="dot"></span>Link Vault</h1>
    <form id="save-form">
      <label for="url-input">URL</label>
      <input type="url" id="url-input" autocomplete="off" required>
      <label for="tags-input">Tags (optional, comma separated)</label>
      <input type="text" id="tags-input" autocomplete="off">
      <label for="note-input">Note (optional)</label>
      <input type="text" id="note-input" autocomplete="off">
      <button type="submit" id="save-btn">Save to Link Vault</button>
      <div id="status"></div>
    </form>
  </div>
  <div class="recent" id="recent-section" hidden>
    <h2>Recently saved</h2>
    <div id="recent-list"></div>
  </div>
  <a class="dashboard-link" id="open-dashboard" href="#">Open full dashboard &rarr;</a>
  <script src="lib/linkvault-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
