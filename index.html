<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link Vault</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F6F5E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Link Vault</h1>
      <div class="user-bar" id="user-bar" hidden>
        <img id="user-avatar" alt="" hidden>
        <span id="user-name"></span>
        <button type="button" id="sign-out-btn">Sign out</button>
      </div>
    </header>

    <div class="panel signin-panel" id="signin-panel">
      <p>Sign in with the Google account whose Drive should store your links.</p>
      <button type="button" class="btn-primary" id="sign-in-btn">Sign in with Google</button>
      <p id="signin-status" class="form-error" hidden></p>
    </div>

    <div id="app-content" hidden>
      <div class="toolbar" id="toolbar" hidden>
        <div class="stats-strip" id="stats-strip"></div>

        <div class="search-row">
          <input type="text" id="search-input" placeholder="Search saved links…">
          <button type="button" class="btn-primary" id="open-add-btn">Add a link</button>
        </div>

        <div class="chip-row" id="platform-chips"></div>
        <div class="chip-row" id="status-chips"></div>
        <div class="tag-filter-banner" id="tag-banner" hidden></div>
      </div>

      <div id="status-area"></div>
      <div class="grid" id="list"></div>
    </div>
  </div>

  <div class="modal-overlay" id="add-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Add a link</h2>
        <button type="button" class="modal-close" id="close-modal-btn" aria-label="Close">&times;</button>
      </div>
      <form id="add-form">
        <label for="url-input">URL</label>
        <input type="url" id="url-input" placeholder="instagram.com/p/…, linkedin.com/posts/…, anything" autocomplete="off">

        <label for="tags-input">Tags</label>
        <input type="text" id="tags-input" placeholder="optional, comma separated" autocomplete="off">

        <label for="note-input">Note</label>
        <input type="text" id="note-input" placeholder="optional" autocomplete="off">

        <p class="form-error" id="form-error" hidden></p>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancel-add-btn">Cancel</button>
          <button type="submit" class="btn-primary" id="save-btn">Save link</button>
        </div>
      </form>
    </div>
  </div>

  <script src="lib/linkvault-core.js"></script>
  <script src="lib/drive-client.js"></script>
  <script src="lib/google-auth.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
